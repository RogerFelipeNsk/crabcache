name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t crabcache:security-scan .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'crabcache:security-scan'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Trivy vulnerability scanner (JSON output)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'crabcache:security-scan'
        format: 'json'
        output: 'trivy-results.json'

    - name: Install Grype
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Run Grype vulnerability scanner
      run: |
        grype crabcache:security-scan -o json > grype-results.json

    - name: Check for critical vulnerabilities
      run: |
        # Check Trivy results for critical vulnerabilities
        CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
        HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
        
        echo "Critical vulnerabilities found: $CRITICAL_COUNT"
        echo "High vulnerabilities found: $HIGH_COUNT"
        
        # Fail if critical vulnerabilities are found
        if [ "$CRITICAL_COUNT" -gt 0 ]; then
          echo "❌ Critical vulnerabilities found! Please address them before merging."
          exit 1
        fi
        
        # Warn about high vulnerabilities but don't fail
        if [ "$HIGH_COUNT" -gt 0 ]; then
          echo "⚠️ High severity vulnerabilities found. Consider addressing them."
        fi

    - name: Generate security report
      run: |
        mkdir -p security-reports
        
        # Create summary report
        cat > security-reports/summary.md << EOF
        # Security Scan Report
        
        **Date**: $(date)
        **Image**: crabcache:security-scan
        **Workflow**: ${{ github.workflow }}
        **Run ID**: ${{ github.run_id }}
        
        ## Scan Results
        
        ### Trivy Scanner
        - Critical: $(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
        - High: $(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
        - Medium: $(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")] | length' trivy-results.json)
        - Low: $(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")] | length' trivy-results.json)
        
        ### Grype Scanner
        - Critical: $(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' grype-results.json)
        - High: $(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' grype-results.json)
        - Medium: $(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' grype-results.json)
        - Low: $(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' grype-results.json)
        
        ## Files Generated
        - trivy-results.sarif (for GitHub Security tab)
        - trivy-results.json (detailed JSON report)
        - grype-results.json (Grype detailed report)
        
        ## Next Steps
        1. Review detailed reports for vulnerability information
        2. Update Dockerfile to address critical/high vulnerabilities
        3. Rebuild and test the image
        4. Re-run security scan to verify fixes
        EOF
        
        cp trivy-results.json security-reports/
        cp grype-results.json security-reports/

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: security-reports/
        retention-days: 30

    - name: Comment PR with security results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Read the summary report
          const summary = fs.readFileSync('security-reports/summary.md', 'utf8');
          
          // Create comment body
          const body = `## 🔒 Security Scan Results
          
          ${summary}
          
          📊 **Full reports available in the workflow artifacts.**
          
          ---
          *This comment was automatically generated by the security scan workflow.*`;
          
          // Post comment
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  dependency-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run cargo audit
      run: |
        cargo audit --json > cargo-audit-results.json || true

    - name: Check for vulnerabilities in dependencies
      run: |
        # Check if there are any vulnerabilities
        VULN_COUNT=$(jq '.vulnerabilities.count' cargo-audit-results.json)
        
        echo "Rust dependency vulnerabilities found: $VULN_COUNT"
        
        if [ "$VULN_COUNT" -gt 0 ]; then
          echo "⚠️ Vulnerabilities found in Rust dependencies:"
          jq '.vulnerabilities.list[] | "- \(.advisory.title) (\(.advisory.id))"' -r cargo-audit-results.json
          echo ""
          echo "Please update dependencies or review the vulnerabilities."
        else
          echo "✅ No vulnerabilities found in Rust dependencies."
        fi

    - name: Upload dependency scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-scan-results
        path: cargo-audit-results.json
        retention-days: 30