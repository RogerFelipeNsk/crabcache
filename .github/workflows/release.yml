name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install Redis
        run: |
          curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update && sudo apt-get install -y redis-server
      - run: cargo nextest run --release
        env:
          CRABCACHE_REQUIRE_REDIS: "1"

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/crabcache:${{ github.ref_name }}
            ${{ secrets.DOCKER_USERNAME }}/crabcache:latest

  github-release:
    needs: [test, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        # Re-running the workflow (e.g. after fixing registry credentials) must not fail here.
        run: |
          notes_file="docs/releases/$RELEASE_TAG.md"
          title="CrabCache $RELEASE_TAG"
          if [ "$RELEASE_TAG" = "v0.3.0" ]; then title="$title — CrabPack"; fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            if [ -f "$notes_file" ]; then
              gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$notes_file"
            fi
            echo "Release $RELEASE_TAG already exists"
          elif [ -f "$notes_file" ]; then
            gh release create "$RELEASE_TAG" --title "$title" --notes-file "$notes_file" --verify-tag
          else
            gh release create "$RELEASE_TAG" --generate-notes --verify-tag
          fi
