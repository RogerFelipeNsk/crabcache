<text x="24" y="418" font-size="12">Latência inclui rede e resposta; CPU mede o processo servidor. Menor é melhor. Não é tempo isolado de zstd.</text>
<text x="24" y="440" font-size="12">Dados sintéticos e rodadas curtas. Variação, p99, RAM e metodologia estão no relatório completo.</text>
