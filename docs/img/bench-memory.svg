<svg xmlns="http://www.w3.org/2000/svg" width="720" height="374" viewBox="0 0 720 374" role="img" aria-labelledby="t d">
<title id="t">Memória por chave</title>
<desc id="d">1M de chaves (300k para 1 KB) carregadas via redis-cli --pipe · memória física (footprint). Valores de 10 B: Redis 86 B, CrabCache 63 B; Valores de 100 B: Redis 184 B, CrabCache 159 B; Valores de 1 KB: Redis 1.110 B, CrabCache 1.066 B</desc>

<style>
  .surface { fill: #fcfcfb; }
