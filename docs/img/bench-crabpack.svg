<svg xmlns="http://www.w3.org/2000/svg" width="720" height="464" viewBox="0 0 720 464" role="img" aria-labelledby="t d">
<title id="t">Memória por chave com dados reais (JSON)</title>
<desc id="d">300k chaves por conjunto · CrabPack treina um dicionário por prefixo e comprime valores ociosos. Sessões de usuário (298 B em média): Redis 8.10 415 B, CrabCache 391 B, CrabCache + CrabPack 164 B; Produtos (282 B): Redis 8.10 401 B, CrabCache 363 B, CrabCache + CrabPack 161 B; Respostas de API (316 B): Redis 8.10 415 B, CrabCache 388 B, CrabCache + CrabPack 171 B</desc>

