<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" role="img" aria-labelledby="t d">
<title id="t">Throughput com o mesmo núcleo</title>
<desc id="d">Ambos limitados a ~1 núcleo de CPU (medido) · memtier_benchmark, 48 conexões, 90% GET, valores de 100 B. Sem pipeline: Redis 112k ops/s, CrabCache 136k ops/s; Pipeline de 16 comandos: Redis 924k ops/s, CrabCache 1.71M ops/s</desc>

<style>
  .surface { fill: #fcfcfb; }
  .ring { fill: none; stroke: rgba(11,11,11,0.10); }
  .title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
  .subtitle { fill: #52514e; font-size: 12.5px; }
  .panel { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
  .label { fill: #52514e; font-size: 12.5px; }
  .value { fill: #0b0b0b; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .delta { fill: #006300; font-size: 12.5px; font-weight: 600; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .s-redis { fill: #2a78d6; }
  .s-crab { fill: #eb6834; }
  .note { fill: #898781; font-size: 11px; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ring { stroke: rgba(255,255,255,0.10); }
    .title, .panel, .value { fill: #ffffff; }
    .subtitle, .label { fill: #c3c2b7; }
    .delta { fill: #0ca30c; }
    .axis { stroke: #383835; }
    .s-redis { fill: #3987e5; }
    .s-crab { fill: #d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>

<rect class="surface" x="0.5" y="0.5" width="719" height="283" rx="10"/>
<rect class="ring" x="0.5" y="0.5" width="719" height="283" rx="10"/>
<text class="title" x="24" y="32">Throughput com o mesmo núcleo</text>
<text class="subtitle" x="24" y="52">Ambos limitados a ~1 núcleo de CPU (medido) · memtier_benchmark, 48 conexões, 90% GET, valores de 100 B</text>
<rect class="s-redis" x="476" y="22" width="12" height="12" rx="3"/>
<text class="label" x="494" y="32">Redis 8.10</text>
<rect class="s-crab" x="580" y="22" width="12" height="12" rx="3"/>
<text class="label" x="598" y="32">CrabCache 0.2</text>
<text class="panel" x="24" y="86">Sem pipeline</text>
<text class="label" x="114" y="112.5" text-anchor="end">Redis</text>
<path class="s-redis" d="M124.0,98.0 H467.9 Q471.9,98.0 471.9,102.0 V114.0 Q471.9,118.0 467.9,118.0 H124.0 Z"/>
<text class="value" x="479.9" y="112.5">112k ops/s</text>
<text class="label" x="114" y="134.5" text-anchor="end">CrabCache</text>
<path class="s-crab" d="M124.0,120.0 H542.0 Q546.0,120.0 546.0,124.0 V136.0 Q546.0,140.0 542.0,140.0 H124.0 Z"/>
<text class="value" x="554.0" y="134.5">136k ops/s<tspan class="delta" dx="8">+21%</tspan></text>
<line class="axis" x1="124" y1="94" x2="124" y2="144"/>
