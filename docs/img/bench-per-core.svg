<text class="title" x="24" y="32">Throughput com o mesmo núcleo</text>
<text class="subtitle" x="24" y="52">Ambos limitados a ~1 núcleo de CPU (medido) · memtier_benchmark, 48 conexões, 90% GET, valores de 100 B</text>
