<svg xmlns="http://www.w3.org/2000/svg" width="720" height="308" viewBox="0 0 720 308" role="img" aria-labelledby="t d">
<title id="t">Throughput com o mesmo núcleo</title>
<desc id="d">Ambos limitados a ~1 núcleo de CPU (medido) · memtier_benchmark, 48 conexões, 90% GET, valores de 100 B. Sem pipeline: Redis 8.10 112k ops/s, CrabCache 0.2 136k ops/s; Pipeline de 16 comandos: Redis 8.10 924k ops/s, CrabCache 0.2 1.71M ops/s</desc>

<style>
  .surface { fill: #fcfcfb; }
  .ring { fill: none; stroke: rgba(11,11,11,0.10); }
  .title { fill: #0b0b0b; font-size: 16px; font-weight: 600; }
  .subtitle { fill: #52514e; font-size: 12.5px; }
  .panel { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
  .label { fill: #52514e; font-size: 12.5px; }
  .value { fill: #0b0b0b; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .delta { fill: #006300; font-size: 12.5px; font-weight: 600; }
  .axis { stroke: #c3c2b7; stroke-width: 1; }
  .s-redis { fill: #2a78d6; }
  .s-crab { fill: #eb6834; }
  .s-pack { fill: #1baf7a; }
  .note { fill: #898781; font-size: 11px; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ring { stroke: rgba(255,255,255,0.10); }
    .title, .panel, .value { fill: #ffffff; }
    .subtitle, .label { fill: #c3c2b7; }
    .delta { fill: #0ca30c; }
    .axis { stroke: #383835; }
    .s-redis { fill: #3987e5; }
    .s-crab { fill: #d95926; }
    .s-pack { fill: #199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
</style>

