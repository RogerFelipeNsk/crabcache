<text class="label" x="114" y="202.5" text-anchor="end">Redis</text>
<path class="s-redis" d="M124.0,188.0 H347.8 Q351.8,188.0 351.8,192.0 V204.0 Q351.8,208.0 347.8,208.0 H124.0 Z"/>
<text class="value" x="359.8" y="202.5">924k ops/s</text>
<text class="label" x="114" y="224.5" text-anchor="end">CrabCache</text>
<path class="s-crab" d="M124.0,210.0 H542.0 Q546.0,210.0 546.0,214.0 V226.0 Q546.0,230.0 542.0,230.0 H124.0 Z"/>
<text class="value" x="554.0" y="224.5">1.71M ops/s<tspan class="delta" dx="8">+85%</tspan></text>
<line class="axis" x1="124" y1="184" x2="124" y2="234"/>
<text class="note" x="24" y="268">Apple M1 Pro, macOS, loopback · CrabCache com --threads 1 · scripts/bench-1cpu.sh</text>
