[package]
name = "crabcache"
version = "0.1.0"
edition = "2021"
authors = ["Roger Felipe <rogerfelipe.nsk@gmail.com>"]
description = "High-performance in-memory cache server written in Rust"
license = "MIT"
repository = "https://github.com/RogerFelipeNsk/crabcache"
keywords = ["cache", "redis", "performance", "rust"]
categories = ["caching", "database"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
tokio = { version = "1.0", features = ["full", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
prometheus = "0.13"
ahash = "0.8"
bytes = "1.0"
thiserror = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
bincode = "1.3"
crc32fast = "1.3"
async-trait = "0.1"
futures = "0.3"
num_cpus = "1.0"
crossbeam-queue = "0.3"
memmap2 = "0.9"
tempfile = "3.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
dashmap = "5.5"
parking_lot = "0.12"

# Performance-critical dependencies
mimalloc = { version = "0.1", default-features = false, optional = true }
crossbeam = "0.8"
crossbeam-epoch = "0.9"
crossbeam-utils = "0.8"
rayon = "1.0"

# LOCK-FREE OPTIMIZATIONS - CRITICAL FOR PERFORMANCE
thread_local = "1.1"
memchr = "2.6"  # SIMD string search

# SIMD and vectorization
wide = { version = "0.7", optional = true }
bytemuck = { version = "1.0", optional = true }

# Network optimizations
socket2 = "0.5"
mio = "0.8"

# Protobuf support
prost = "0.12"
prost-types = "0.12"

# TOON Protocol support
base64 = "0.22"

# Optional io_uring support (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.6", optional = true }

[features]
default = ["fast-alloc"]
simd = ["wide", "bytemuck"]
fast-alloc = ["mimalloc"]
io-uring = ["dep:io-uring"]

[build-dependencies]
prost-build = "0.12"
