[package]
name = "crabcache"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Roger Felipe <rogerfelipe.nsk@gmail.com>"]
description = "Redis-compatible in-memory cache server written in Rust"
license = "MIT"
repository = "https://github.com/RogerFelipeNsk/crabcache"
keywords = ["cache", "redis", "resp", "key-value"]
categories = ["caching", "database"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"

[profile.bench]
inherits = "release"

[dependencies]
ahash = "0.8.12"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
hashbrown = "0.17.1"
itoa = "1.0.18"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
memchr = "2.8.3"
mimalloc = "0.1.52"
parking_lot = "0.12.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = { version = "0.14.0", default-features = false, features = ["zdict_builder", "experimental"] }

[dev-dependencies]
rand = "0.10.3"
redis = "1.2.2"
